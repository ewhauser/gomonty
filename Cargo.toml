[workspace]
resolver = "2"
members = ["crates/gomonty-worker", "crates/monty-go-ffi"]

[workspace.package]
edition = "2024"
version = "0.0.14"
rust-version = "1.95"
license = "MIT"
authors = ["Eric Hauser"]
categories = ["compilers", "emulators", "development-tools"]
keywords = ["python", "interpreter", "sandbox", "embedded", "go"]
homepage = "https://github.com/ewhauser/gomonty"
repository = "https://github.com/ewhauser/gomonty"
documentation = "https://github.com/ewhauser/gomonty"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
# Upstream Monty v0.0.19. Keep every Monty crate on the exact same release
# commit: the subprocess protocol intentionally rejects version skew.
monty = { git = "https://github.com/pydantic/monty.git", rev = "e347739909877f4fb03877e23dd092286fc7e659" }
monty_pool = { git = "https://github.com/pydantic/monty.git", package = "monty-pool", rev = "e347739909877f4fb03877e23dd092286fc7e659" }
monty_proto = { git = "https://github.com/pydantic/monty.git", package = "monty-proto", rev = "e347739909877f4fb03877e23dd092286fc7e659" }
monty_types = { git = "https://github.com/pydantic/monty.git", package = "monty-types", rev = "e347739909877f4fb03877e23dd092286fc7e659" }
monty_type_checking = { git = "https://github.com/pydantic/monty.git", package = "monty-type-checking", rev = "e347739909877f4fb03877e23dd092286fc7e659" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
postcard = { version = "1.1", features = ["alloc"] }
num-bigint = { version = "0.4", features = ["serde"] }
pretty_assertions = "1.4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[workspace.lints.rustdoc]
invalid_codeblock_attributes = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
use_self = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
