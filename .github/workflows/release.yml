name: publish-native-runtime

on:
  workflow_dispatch:
    inputs:
      prep_run_id:
        description: "Successful runtime-release-prep workflow run ID whose exact artifact will be promoted"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-native-runtime
  cancel-in-progress: false

env:
  GNU_GLIBC_FLOOR: "2.35"
  MUSL_GO_IMAGE: golang@sha256:c8e1680f8002c64ddfba276a3c1f763097cb182402673143a89dcca4c107cf17

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: native-runtime-release
    env:
      GH_TOKEN: ${{ github.token }}
      PREP_RUN_ID: ${{ inputs.prep_run_id }}
    outputs:
      release_tag: ${{ steps.publish_release.outputs.tag }}
      target_sha: ${{ steps.release_target.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Require protected main
        id: release_target
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git rev-parse HEAD > release-target-sha.txt
          printf 'sha=%s\n' "$(cat release-target-sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Validate retained build run
        shell: bash
        run: |
          case "$PREP_RUN_ID" in
            ''|*[!0-9]*)
              echo "prep_run_id must contain only decimal digits" >&2
              exit 1
              ;;
          esac
          run_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/actions/runs/${PREP_RUN_ID}")"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .name <<<"$run_json")" = "runtime-release-prep"
          run_sha="$(jq -r .head_sha <<<"$run_json")"
          test -n "$run_sha"
          git merge-base --is-ancestor "$run_sha" HEAD
          printf '%s\n' "$run_sha" > expected-source-sha.txt

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-release-package
          path: .release-package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prep_run_id }}

      - name: Verify exact promotion package
        shell: bash
        run: |
          cmp expected-source-sha.txt .release-package/source-sha.txt
          test "$(cat .release-package/prep-run-id.txt)" = "$PREP_RUN_ID"
          cmp internal/runtimebundle/manifests/current.json .release-package/current.json
          go run ./internal/cmd/runtime-release verify \
            --manifest .release-package/current.json \
            --assets .release-package/assets
          go test -race -count=1 ./internal/runtimebundle ./internal/ffi ./internal/cmd/runtime-release ./cmd/gomonty
          git diff --check

      - name: Attest the promoted bytes
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            .release-package/assets/*.zip
            .release-package/current.json

      - name: Create draft release and upload exact assets
        id: create_release
        shell: bash
        run: |
          tag="$(sed -n 's/.*"release_tag": "\([^"]*\)".*/\1/p' .release-package/current.json)"
          test -n "$tag"
          target_sha="$(cat release-target-sha.txt)"
          source_sha="$(cat expected-source-sha.txt)"
          releases_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          existing_id="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' <<<"$releases_json")"
          if gh release view "$tag" >/dev/null 2>&1 || [ -n "$existing_id" ]; then
            echo "Release $tag already exists; release artifacts are never replaced." >&2
            exit 1
          fi
          gh release create "$tag" \
            --draft \
            --latest=false \
            --target "$target_sha" \
            --title "$tag" \
            --notes "Verified native runtime built from $source_sha and promoted byte-for-byte at $target_sha from runtime-release-prep run $PREP_RUN_ID." \
            .release-package/assets/*.zip \
            .release-package/current.json
          # Draft releases are absent from the release-by-tag endpoint. Resolve
          # the exact draft from the authenticated list before comparing assets.
          release_id=""
          for ((attempt = 1; attempt <= 30; attempt++)); do
            releases_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            matches="$(jq -c --arg tag "$tag" --arg target "$target_sha" \
              '[.[] | select(.tag_name == $tag and .draft == true and .target_commitish == $target)]' \
              <<<"$releases_json")"
            match_count="$(jq length <<<"$matches")"
            if [ "$match_count" -gt 1 ]; then
              echo "Found multiple matching draft releases for $tag at $target_sha." >&2
              exit 1
            fi
            if [ "$match_count" -eq 1 ]; then
              release_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          if [ -z "$release_id" ]; then
            echo "Draft release $tag at $target_sha did not become visible." >&2
            exit 1
          fi
          printf '%s\n' "$tag" > release-tag.txt
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Compare GitHub asset digests before publication
        shell: bash
        run: |
          release_id="${{ steps.create_release.outputs.id }}"
          test -n "$release_id"
          assets_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate)"
          expected_count=0
          for file in .release-package/assets/*.zip .release-package/current.json; do
            expected_count=$((expected_count + 1))
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' <<<"$assets_json")"
            if [ "$actual" != "$expected" ]; then
              echo "GitHub digest mismatch for $name: got $actual, expected $expected" >&2
              exit 1
            fi
          done
          actual_count="$(jq length <<<"$assets_json")"
          test "$actual_count" -eq "$expected_count"

      - name: Publish immutable release
        id: publish_release
        shell: bash
        run: |
          tag="$(cat release-tag.txt)"
          target_sha="$(cat release-target-sha.txt)"
          release_id="${{ steps.create_release.outputs.id }}"
          release_json="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -f make_latest=false)"
          test "$(jq -r .id <<<"$release_json")" = "$release_id"
          test "$(jq -r .tag_name <<<"$release_json")" = "$tag"
          test "$(jq -r .target_commitish <<<"$release_json")" = "$target_sha"
          test "$(jq -r .draft <<<"$release_json")" = "false"
          published=false
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if published_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
              if [ "$(jq -r .id <<<"$published_json")" = "$release_id" ] &&
                [ "$(jq -r .immutable <<<"$published_json")" = "true" ]; then
                published=true
                break
              fi
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          if [ "$published" != "true" ]; then
            echo "Published release $tag did not become visible as immutable." >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Verify public download from a clean cache
        shell: bash
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/published-runtime-cache
        run: |
          prepared=false
          for ((attempt = 1; attempt <= 15; attempt++)); do
            if go run ./cmd/gomonty prepare download --json; then
              prepared=true
              break
            fi
            if [ "$attempt" -lt 15 ]; then
              sleep 2
            fi
          done
          test "$prepared" = "true"
          cd examples
          CGO_ENABLED=0 go run ./cmd/example

  verify-public-native:
    name: public download ${{ matrix.name }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: darwin-arm64
            runner: macos-14
          - name: windows-amd64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.target_sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify GNU runtime floor
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: test "$(getconf GNU_LIBC_VERSION)" = "glibc $GNU_GLIBC_FLOOR"

      - name: Download, verify, load, and execute the published target
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/published-runtime-cache
          GOMONTY_TEST_PUBLIC_RELEASE: "1"
        run: go test -race -count=1 -run '^TestPublishedReleaseEndToEnd$' ./

  verify-public-musl:
    name: public download ${{ matrix.name }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-musl
            runner: ubuntu-24.04
            go_arch: amd64
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            go_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.target_sha }}

      - name: Download, verify, load, and execute the published musl target
        shell: bash
        run: |
          docker run --rm \
            --platform "linux/${{ matrix.go_arch }}" \
            -v "$PWD:/work" \
            -w /work \
            -e GOMONTY_TEST_PUBLIC_RELEASE=1 \
            "$MUSL_GO_IMAGE" \
            sh -c '
              set -eux
              test "$(go env GOVERSION)" = go1.25.0
              test "$(go env GOHOSTOS)" = linux
              test "$(go env GOHOSTARCH)" = "${{ matrix.go_arch }}"
              test -s /etc/ssl/certs/ca-certificates.crt
              CGO_ENABLED=0 go test -count=1 -run "^TestPublishedReleaseEndToEnd$" ./
            '
