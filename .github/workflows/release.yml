name: publish-native-runtime

on:
  workflow_dispatch:
    inputs:
      prep_run_id:
        description: "Successful runtime-release-prep workflow run ID whose exact artifact will be promoted"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-native-runtime
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: native-runtime-release
    env:
      GH_TOKEN: ${{ github.token }}
      PREP_RUN_ID: ${{ inputs.prep_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Require protected main
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git rev-parse HEAD > release-target-sha.txt

      - name: Validate retained build run
        shell: bash
        run: |
          case "$PREP_RUN_ID" in
            ''|*[!0-9]*)
              echo "prep_run_id must contain only decimal digits" >&2
              exit 1
              ;;
          esac
          run_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/actions/runs/${PREP_RUN_ID}")"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .name <<<"$run_json")" = "runtime-release-prep"
          run_sha="$(jq -r .head_sha <<<"$run_json")"
          test -n "$run_sha"
          git merge-base --is-ancestor "$run_sha" HEAD
          printf '%s\n' "$run_sha" > expected-source-sha.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-release-package
          path: .release-package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prep_run_id }}

      - name: Verify exact promotion package
        shell: bash
        run: |
          cmp expected-source-sha.txt .release-package/source-sha.txt
          test "$(cat .release-package/prep-run-id.txt)" = "$PREP_RUN_ID"
          cmp internal/runtimebundle/manifests/current.json .release-package/current.json
          go run ./internal/cmd/runtime-release verify \
            --manifest .release-package/current.json \
            --assets .release-package/assets
          go test -race -count=1 ./internal/runtimebundle ./internal/ffi ./internal/cmd/runtime-release ./cmd/gomonty
          git diff --check

      - name: Require immutable releases before publication
        shell: bash
        run: |
          enabled="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)"
          test "$enabled" = "true"

      - name: Attest the promoted bytes
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            .release-package/assets/*.zip
            .release-package/current.json

      - name: Create draft release and upload exact assets
        shell: bash
        run: |
          tag="$(sed -n 's/.*"release_tag": "\([^"]*\)".*/\1/p' .release-package/current.json)"
          test -n "$tag"
          target_sha="$(cat release-target-sha.txt)"
          source_sha="$(cat expected-source-sha.txt)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; release artifacts are never replaced." >&2
            exit 1
          fi
          gh release create "$tag" \
            --draft \
            --latest=false \
            --target "$target_sha" \
            --title "$tag" \
            --notes "Verified native runtime built from $source_sha and promoted byte-for-byte at $target_sha from runtime-release-prep run $PREP_RUN_ID." \
            .release-package/assets/*.zip \
            .release-package/current.json
          printf '%s\n' "$tag" > release-tag.txt

      - name: Compare GitHub asset digests before publication
        shell: bash
        run: |
          tag="$(cat release-tag.txt)"
          release_id="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          assets_json="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate)"
          expected_count=0
          for file in .release-package/assets/*.zip .release-package/current.json; do
            expected_count=$((expected_count + 1))
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' <<<"$assets_json")"
            if [ "$actual" != "$expected" ]; then
              echo "GitHub digest mismatch for $name: got $actual, expected $expected" >&2
              exit 1
            fi
          done
          actual_count="$(jq length <<<"$assets_json")"
          test "$actual_count" -eq "$expected_count"

      - name: Publish immutable release
        shell: bash
        run: |
          tag="$(cat release-tag.txt)"
          gh release edit "$tag" --draft=false --latest=false
          immutable="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .immutable)"
          test "$immutable" = "true"

      - name: Verify public download from a clean cache
        shell: bash
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/published-runtime-cache
        run: |
          go run ./cmd/gomonty prepare download --json
          cd examples
          CGO_ENABLED=0 go run ./cmd/example
