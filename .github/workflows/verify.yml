name: verify

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MUSL_GO_IMAGE: golang@sha256:c8e1680f8002c64ddfba276a3c1f763097cb182402673143a89dcca4c107cf17
  MUSL_RUST_IMAGE: rust@sha256:77d036177a4caf204bf23c6c68e1aa013a0d919fd40058eb27943295080fe869
  NATIVE_PYTHON: 3.12.10
  RUST_TOOLCHAIN: 1.95.0

jobs:
  release-prep-proof:
    name: release prep proof
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/runtime-build.yml

  source-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: Reject tracked native executables
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(gomonty-worker(\.exe)?|[^/]+\.(so|dylib|dll|a|lib))$'; then
            echo "Native executables must be distributed as verified release assets, never tracked in Git." >&2
            exit 1
          fi

      - name: Verify manifest and release tooling
        run: go test -race -count=1 ./internal/runtimebundle ./internal/ffi ./internal/cmd/runtime-release ./cmd/gomonty

      - name: Verify the source-only module builds
        run: |
          go test -run '^$' ./...
          go vet ./...

  native:
    name: native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - name: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - name: windows-amd64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.NATIVE_PYTHON }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "$NATIVE_PYTHON"
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = "$RUST_TOOLCHAIN"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.rust_target }}"
          rustup default "$RUST_TOOLCHAIN"

      - name: Build and prepare reviewed native source
        shell: bash
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: |
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export PYO3_PYTHON
          go run ./cmd/gomonty prepare build --source . --json
          go run ./cmd/gomonty prepare build --source . --json

      - name: Run native tests
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: go test -race -count=1 ./...

      - name: Run single-worker snapshot recovery stress
        if: matrix.name == 'linux-amd64'
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: taskset --cpu-list 0 go test -run '^TestReplSnapshotRestoresAndCancellationAbandonsFeed$' -count=10 ./...

      - name: Run example from a separate module
        shell: bash
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: |
          cd examples
          CGO_ENABLED=0 go run ./cmd/example

  musl:
    name: native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-musl
            runner: ubuntu-24.04
            go_arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            go_arch: arm64
            rust_target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build musl preparation, test, and example binaries
        shell: bash
        run: |
          mkdir -p .musl-smoke
          docker run --rm \
            --platform "linux/${{ matrix.go_arch }}" \
            -v "$PWD:/work" \
            -w /work \
            "$MUSL_GO_IMAGE" \
            sh -c '
              set -eux
              test "$(go env GOVERSION)" = go1.25.0
              test "$(go env GOHOSTOS)" = linux
              test "$(go env GOHOSTARCH)" = "${{ matrix.go_arch }}"
              CGO_ENABLED=0 go build -o .musl-smoke/gomonty ./cmd/gomonty
              CGO_ENABLED=0 go test -c -o .musl-smoke/gomonty.test ./
              (cd examples && CGO_ENABLED=0 go build -o ../.musl-smoke/example ./cmd/example)
            '

      - name: Build, prepare, and execute on musl
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$MUSL_RUST_IMAGE" \
            sh -c '
              set -eux
              apk add --no-cache bash=5.2.37-r0 build-base=0.5-r3 python3=3.12.13-r0
              PYO3_PYTHON="$(command -v python3)"
              export PYO3_PYTHON
              export MONTY_GO_FFI_MUSL_NATIVE=1
              export GOMONTY_CACHE_DIR=/work/.musl-cache-${{ matrix.name }}
              export CARGO_TARGET_DIR=/work/.musl-target-${{ matrix.name }}
              /work/.musl-smoke/gomonty prepare build --source /work --json | tee /tmp/prepared.json
              grep -Fq "\"target\": \"${{ matrix.name }}\"" /tmp/prepared.json
              grep -Fq "\"rust_toolchain\": \"1.95.0\"" /tmp/prepared.json
              /work/.musl-smoke/gomonty prepare build --source /work --json
              /work/.musl-smoke/gomonty.test -test.count=1
              /work/.musl-smoke/example
            '
