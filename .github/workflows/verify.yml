name: verify

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  release-prep-proof:
    name: release prep proof
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/runtime-build.yml

  source-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: Reject tracked native executables
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(gomonty-worker(\.exe)?|[^/]+\.(so|dylib|dll|a|lib))$'; then
            echo "Native executables must be distributed as verified release assets, never tracked in Git." >&2
            exit 1
          fi

      - name: Verify manifest and release tooling
        run: go test -race -count=1 ./internal/runtimebundle ./internal/ffi ./internal/cmd/runtime-release ./cmd/gomonty

      - name: Verify the source-only module builds
        run: |
          go test -run '^$' ./...
          go vet ./...

  native:
    name: native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - name: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - name: windows-amd64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.rust_target }}"
          rustup default "$RUST_TOOLCHAIN"

      - name: Build and prepare reviewed native source
        shell: bash
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: |
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export PYO3_PYTHON
          go run ./cmd/gomonty prepare build --source . --json
          go run ./cmd/gomonty prepare build --source . --json

      - name: Run native tests
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: go test -race -count=1 ./...

      - name: Run single-worker snapshot recovery stress
        if: matrix.name == 'linux-amd64'
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: taskset --cpu-list 0 go test -run '^TestReplSnapshotRestoresAndCancellationAbandonsFeed$' -count=10 ./...

      - name: Run example from a separate module
        shell: bash
        env:
          GOMONTY_CACHE_DIR: ${{ runner.temp }}/gomonty-cache
        run: |
          cd examples
          CGO_ENABLED=0 go run ./cmd/example

  musl:
    name: build-only ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            target_id: linux-amd64-musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            target_id: linux-arm64-musl

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build native pair in pinned musl image
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            rust@sha256:77d036177a4caf204bf23c6c68e1aa013a0d919fd40058eb27943295080fe869 \
            sh -c '
              set -eux
              apk add --no-cache bash build-base python3
              PYO3_PYTHON="$(command -v python3)"
              export PYO3_PYTHON
              export MONTY_GO_FFI_MUSL_NATIVE=1
              MONTY_GO_FFI_SKIP_HEADER=1 bash scripts/build-go-ffi.sh "${{ matrix.rust_target }}"
            '

      - name: Record and validate local build hashes
        run: go run ./internal/cmd/runtime-release inspect-input --target "${{ matrix.target_id }}"
