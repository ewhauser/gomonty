name: runtime-release-prep

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Commit the generated manifest and open the release-prep PR (main only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require main before enabling the write-capable job
        if: inputs.open_pr
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

  build:
    needs: validate
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/runtime-build.yml

  open-pr:
    name: open release-prep PR
    if: inputs.open_pr && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-release-package
          path: .release-package

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-source-metadata
          path: .source-metadata

      - name: Commit release manifest
        shell: bash
        run: |
          cp .release-package/current.json internal/runtimebundle/manifests/current.json
          cp .source-metadata/Cargo.lock Cargo.lock
          cp .source-metadata/internal/ffi/include/monty_go_ffi.h internal/ffi/include/monty_go_ffi.h
          branch="runtime-release-prep/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Cargo.lock internal/ffi/include/monty_go_ffi.h internal/runtimebundle/manifests/current.json
          if git diff --cached --quiet; then
            echo "The runtime manifest and generated source files are already current; run ${GITHUB_RUN_ID} is ready for exact-byte promotion after review."
            exit 0
          fi
          git commit -m "build: prepare verified native runtime release"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "build: prepare verified native runtime release" \
            --body "Builds exact native runtime assets in workflow run ${GITHUB_RUN_ID}, commits only the reviewable hashes and generated source metadata, and leaves the binaries in the retained Actions artifact. After merge, publish those exact bytes with: make publish-runtime PREP_RUN_ID=${GITHUB_RUN_ID}"
